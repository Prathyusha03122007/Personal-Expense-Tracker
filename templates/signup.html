{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <h2 class="text-center fw-bold mb-4">Create Account</h2>
            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-4">
                    <label class="form-label text-secondary">Full Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" required placeholder="John Doe">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Email address</label>
                    <input type="email" name="email" class="form-control form-control-lg" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="signupPassword" class="form-control form-control-lg border-end-0" required placeholder="Create a strong password">
                        <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword" style="background-color: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1);">
                            <i class="fa-solid fa-eye text-secondary" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Sign Up</button>
                <div class="text-center text-secondary">
                    Already have an account? <a href="{{ url_for('login') }}" class="text-accent text-decoration-none text-gradient fw-bold">Log In</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('togglePassword').addEventListener('click', function (e) {
        const password = document.getElementById('signupPassword');
        const icon = document.getElementById('toggleIcon');
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}
